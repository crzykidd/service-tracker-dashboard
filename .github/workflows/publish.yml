name: Build and Push Docker Image

# Trigger matrix:
#   push → dev           builds :dev and :sha-<short> (work-in-progress)
#   push → main          builds :latest and :sha-<short> (CI-verified pre-release)
#   pull_request → main  build only — no push (gates branch protection)
#   release published    builds :latest, :<semver>, :<major> (production-ready)
#
# Registry:
#   ghcr.io/crzykidd/service-tracker-dashboard — the only registry.
#   (Docker Hub publishing stopped after v0.6.7.)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  # Job name `build` is a required status check in the main ruleset — don't rename.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches VERSION
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "ERROR: release tag '${GITHUB_REF_NAME}' does not match VERSION '${file}'"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (GHCR)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crzykidd/service-tracker-dashboard
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref_name == 'dev' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == 'main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=ref,event=pr

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_CHANNEL=${{ github.event_name == 'release' && 'release' || (github.event_name == 'pull_request' && 'pr') || (github.ref_name == 'main' && 'main') || 'dev' }}
