{# Compact inventory-stream icon (Tiled and Compact): a DHCP/network glyph in the Docker
   icon's slot. Green normally, amber when the item is missing from the latest snapshot
   (the icon carries the ghost state). Expects `entry` (a stream entry). #}
<span class="status-icon {{ 'status-icon-warn' if entry.inventory_missing else 'status-icon-ok' }} stream-icon"
      title="Stream: {{ entry.stream.display_name if entry.stream else 'unknown' }}{% if entry.ip %} — {{ entry.ip }}{% endif %}{% if entry.inventory_missing %} — missing from the latest snapshot{% endif %}">
  <i class="ti ti-router" aria-hidden="true"></i>
</span>
