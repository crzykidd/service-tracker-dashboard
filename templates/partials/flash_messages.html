{# Flashed messages, shared by Settings, Add and Edit. Category picks the colour. #}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div id="flash-container" class="space-y-2 mb-4" role="status">
      {% for category, message in messages %}
        <div class="flash-alert flex items-center justify-between gap-3 text-sm px-4 py-2 rounded shadow text-white {% if category == 'danger' %}bg-red-700{% elif category == 'warning' %}bg-amber-600{% else %}bg-green-600{% endif %}">
          <span>{{ message }}</span>
          <button type="button" class="text-white hover:text-gray-300" aria-label="Dismiss" onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
